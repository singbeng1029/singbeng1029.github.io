<p>운세로 보는 맞춤 행운번호 앱이에요. 타로·띠별·별자리 운세를 보고, 운세에서 만든 행운번호와 로또 번호 추천을 받아 저장해 두면 추첨 후 당첨 여부를 확인할 수 있어요.</p>
